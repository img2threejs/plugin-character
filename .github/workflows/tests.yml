name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMG2_HOME: ${{ runner.temp }}/character-test-home
      IMG2_HARNESS_DIR: ${{ github.workspace }}/cli/node_modules/@img2threejs/img2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared unit-test dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix cli install --ignore-scripts --no-audit --no-fund
          python -m pip install --only-binary=:all: -r requirements-test.txt
          mkdir -p "$IMG2_HOME"
          ln -s "$IMG2_HARNESS_DIR" "$IMG2_HOME/harness"
      - name: Complete Node suite, including offline VM-module capture checks
        run: npm test
      - name: Complete one-process Python discovery with explicit skip reasons
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Installer consent and dry-run checks
        run: npm --prefix cli test
